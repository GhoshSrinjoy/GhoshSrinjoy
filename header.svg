<svg fill="none" viewBox="0 0 800 400" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container { width: 100%; height: 400px; display: flex; justify-content: center; align-items: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
        .e-card { background: transparent; box-shadow: 0px 8px 28px -9px rgba(0,0,0,0.45); position: relative; width: 300px; height: 380px; border-radius: 16px; overflow: hidden; }
        .wave { position: absolute; width: 600px; height: 700px; opacity: 0.6; left: 0; top: 0; margin-left: -50%; margin-top: -70%; background: linear-gradient(744deg,#af40ff,#5b42f3 60%,#00ddeb); }
        .infotop { text-align: center; font-size: 24px; position: absolute; top: 5.6em; left: 0; right: 0; color: white; font-weight: 600; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        .name { font-size: 16px; font-weight: 300; display: block; margin-top: 10px; letter-spacing: 1px; text-transform: uppercase; }
        .playing .wave { border-radius: 40%; animation: wave 3000ms infinite linear; }
        .wave { border-radius: 40%; animation: wave 55s infinite linear; }
        .playing .wave:nth-child(2) { animation-duration: 4000ms; top: 210px; }
        .playing .wave:nth-child(3) { animation-duration: 5000ms; top: 210px; }
        @keyframes wave { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      </style>
      <div class="container">
        <div class="e-card playing">
          <div class="wave"></div><div class="wave"></div><div class="wave"></div>
          <div class="infotop">Srinjoy Ghosh<span class="name">Data Scientist | AI Engineer</span></div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
