<svg fill="none" viewBox="0 0 800 500" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
	<foreignObject width="100%" height="100%">
		<div xmlns="http://www.w3.org/1999/xhtml">
			<style>
				/* --- CORE LAYOUT & VARIABLES --- */
				.container {
					font-family: 'Segoe UI', Ubuntu, sans-serif;
					width: 100%;
					height: 500px;
					background-color: #e0e5ec;
					display: flex;
					flex-direction: column;
					align-items: center;
					justify-content: center;
					position: relative;
					overflow: hidden;
				}

				/* --- 1. NEUMORPHIC SOCIAL BUTTONS --- */
				.social-row {
					display: flex;
					gap: 20px;
					margin-bottom: 40px;
					z-index: 10;
				}
				.social-btn {
					width: 50px;
					height: 50px;
					border-radius: 50%;
					background: #e0e5ec;
					box-shadow: 9px 9px 16px rgb(163,177,198,0.6), -9px -9px 16px rgba(255,255,255, 0.5);
					display: flex;
					align-items: center;
					justify-content: center;
					font-weight: bold;
					color: #6d5dfc;
					text-decoration: none;
					font-size: 20px;
				}

				/* --- 2. ANIMATED TOGGLE (Auto-playing since click is blocked) --- */
				.toggle-container {
					position: absolute;
					top: 20px;
					right: 20px;
					width: 60px;
					height: 30px;
					background: #e0e5ec;
					border-radius: 30px;
					box-shadow: inset 6px 6px 10px 0 rgba(163,177,198, 0.7), inset -6px -6px 10px 0 rgba(255,255,255, 0.8);
				}
				.toggle-circle {
					width: 24px;
					height: 24px;
					background: #6d5dfc;
					border-radius: 50%;
					position: absolute;
					top: 3px;
					left: 3px;
					animation: toggleMove 4s infinite ease-in-out;
				}
				@keyframes toggleMove {
					0%, 45% { transform: translateX(0); }
					50%, 95% { transform: translateX(30px); background: #333; }
				}

				/* --- 3. ROTATING FLIP CARDS (Glassmorphism) --- */
				.card-container {
					perspective: 1000px;
					width: 300px;
					height: 200px;
				}
				.card-inner {
					position: relative;
					width: 100%;
					height: 100%;
					text-align: center;
					transition: transform 0.8s;
					transform-style: preserve-3d;
					cursor: pointer;
				}
				/* Hover triggers the rotation */
				.card-container:hover .card-inner {
					transform: rotateY(180deg);
				}

				.card-front, .card-back {
					position: absolute;
					width: 100%;
					height: 100%;
					-webkit-backface-visibility: hidden;
					backface-visibility: hidden;
					border-radius: 15px;
					display: flex;
					flex-direction: column;
					align-items: center;
					justify-content: center;
					border: 1px solid rgba(255, 255, 255, 0.4);
					box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2);
				}

				/* Front Design */
				.card-front {
					background: linear-gradient(135deg, rgba(255,255,255,0.4), rgba(255,255,255,0.1));
					backdrop-filter: blur(10px);
				}
				.card-front h2 { color: #4a4a4a; margin: 0; }
				.card-front p { color: #6d5dfc; font-weight: bold; margin-top: 10px; }

				/* Back Design (The "2nd Card Design") */
				.card-back {
					background: linear-gradient(135deg, #6d5dfc, #a1c4fd);
					color: white;
					transform: rotateY(180deg);
				}
				.card-back h3 { margin: 0; }
				.card-back p { font-size: 14px; padding: 0 20px; }

				/* --- BACKGROUND ANIMATION --- */
				.bg-shape {
					position: absolute;
					border-radius: 50%;
					background: linear-gradient(#6d5dfc, #84fab0);
					filter: blur(40px);
					z-index: 0;
					animation: float 6s infinite;
				}
				.s1 { width: 100px; height: 100px; top: 50px; left: 100px; }
				.s2 { width: 150px; height: 150px; bottom: 50px; right: 100px; animation-delay: 2s; }
				
				@keyframes float {
					0%, 100% { transform: translateY(0); }
					50% { transform: translateY(-20px); }
				}
			</style>

			<div class="container">
				<div class="bg-shape s1"></div>
				<div class="bg-shape s2"></div>

				<div class="toggle-container">
					<div class="toggle-circle"></div>
				</div>

				<div class="social-row">
					<div class="social-btn">GH</div>
					<div class="social-btn">LI</div>
					<div class="social-btn">TW</div>
				</div>

				<div class="card-container">
					<div class="card-inner">
						<div class="card-front">
							<h2>My Projects</h2>
							<p>Hover me to flip!</p>
						</div>
						<div class="card-back">
							<h3>RICHES</h3>
							<p>RAG Multimodal System.</p>
							<p>Python • PyTorch • Docker</p>
						</div>
					</div>
				</div>
			</div>
		</div>
	</foreignObject>
</svg>
