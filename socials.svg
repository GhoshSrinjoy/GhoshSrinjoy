<svg fill="none" viewBox="0 0 800 120" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .social-container { display: flex; justify-content: center; align-items: center; height: 120px; padding-top: 10px; font-family: sans-serif; }
        .social-list { display: flex; list-style: none; padding: 0; margin: 0; }
        .social-item { margin: 0 25px; width: 50px; height: 50px; }
        
        /* ISOMETRIC BASE STYLE */
        .social-link { position: relative; display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; background: #fff; text-decoration: none; transform: perspective(1000px) rotate(-30deg) skew(25deg); transition: all 0.4s ease; box-shadow: -20px 20px 10px rgba(0, 0, 0, 0.5); }
        .social-link::before { content: ""; position: absolute; top: 10px; left: -20px; height: 100%; width: 20px; background: #b1b1b1; transition: 0.4s; transform: rotate(0deg) skewY(-45deg); }
        .social-link::after { content: ""; position: absolute; bottom: -20px; left: -10px; height: 20px; width: 100%; background: #b1b1b1; transition: 0.4s; transform: rotate(0deg) skewX(-45deg); }
        
        /* HOVER EFFECTS */
        .social-link:hover { transform: perspective(1000px) rotate(-30deg) skew(25deg) translate(20px, -20px); box-shadow: -50px 50px 50px rgba(0, 0, 0, 0.5); }

        /* COLORS */
        /* Email - Red */
        .mail .social-link { background: #D14836; color: white; }
        .mail .social-link::before { background: #8f2a1d; }
        .mail .social-link::after { background: #b53625; }
        
        /* LinkedIn - Blue */
        .linkedin .social-link { background: #0077B5; color: white; }
        .linkedin .social-link::before { background: #004d75; }
        .linkedin .social-link::after { background: #006091; }
        
        /* Portfolio - Web Blue/Green */
        .web .social-link { background: #4285F4; color: white; }
        .web .social-link::before { background: #1c52b0; }
        .web .social-link::after { background: #2a65d1; }

        /* TEXT ICONS (Safe for GitHub) */
        .icon { font-weight: 900; font-size: 26px; line-height: 1; display: block; }
        .mail .icon { font-size: 30px; margin-top: -3px; } /* @ symbol adjustment */
        .web .icon { font-size: 14px; font-weight: bold; letter-spacing: 0px; } /* WWW adjustment */
      </style>
      
      <div class="social-container">
        <ul class="social-list">
          <li class="social-item mail">
            <a class="social-link">
               <span class="icon">@</span>
            </a>
          </li>
          <li class="social-item linkedin">
            <a class="social-link">
              <span class="icon">in</span>
            </a>
          </li>
          <li class="social-item web">
            <a class="social-link">
               <span class="icon">WWW</span>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </foreignObject>
</svg>
