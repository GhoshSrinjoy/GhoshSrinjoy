<svg fill="none" viewBox="0 0 800 250" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .slider { width: 100%; height: 250px; overflow: hidden; mask-image: linear-gradient(to right, transparent, #000 10% 90%, transparent); display: flex; align-items: center; }
        .list { display: flex; width: 100%; min-width: calc(200px * 10); position: relative; }
        .item { width: 200px; height: 180px; background-color: #161b22; margin-left: 20px; border-radius: 12px; position: absolute; left: 100%; animation: autoRun 15s linear infinite; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #333; transition: all 0.3s; overflow: hidden; }
        .item h3 { color: white; margin: 0; font-family: sans-serif; font-size: 16px; z-index: 2; text-align: center; }
        .item p { color: #888; font-family: sans-serif; font-size: 12px; z-index: 2; margin-top: 5px; }
        
        /* The Wave Effect inside the item on Hover */
        .wave-bg { position: absolute; width: 300px; height: 300px; background: linear-gradient(744deg,#af40ff,#5b42f3 60%,#00ddeb); top: 180px; left: -50px; border-radius: 40%; transition: top 0.5s; opacity: 0.8; animation: spin 4s infinite linear; }
        .item:hover .wave-bg { top: -50px; }
        .item:hover { border-color: #af40ff; transform: scale(1.05); }
        .item:hover h3, .item:hover p { color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }

        @keyframes autoRun { from { left: 100%; } to { left: -200px; } }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Staggered Delays for 6 items */
        .item:nth-child(1) { animation-delay: calc((15s / 6) * (1 - 1) - 15s) !important; }
        .item:nth-child(2) { animation-delay: calc((15s / 6) * (2 - 1) - 15s) !important; }
        .item:nth-child(3) { animation-delay: calc((15s / 6) * (3 - 1) - 15s) !important; }
        .item:nth-child(4) { animation-delay: calc((15s / 6) * (4 - 1) - 15s) !important; }
        .item:nth-child(5) { animation-delay: calc((15s / 6) * (5 - 1) - 15s) !important; }
        .item:nth-child(6) { animation-delay: calc((15s / 6) * (6 - 1) - 15s) !important; }
      </style>

      <div class="slider">
        <div class="list">
          <div class="item">
            <div class="wave-bg"></div>
            <h3>Workflow Auto</h3><p>GPT-3.5 + Argo</p>
          </div>
          <div class="item">
            <div class="wave-bg"></div>
            <h3>FPGA ML</h3><p>Vitis AI + YOLO</p>
          </div>
          <div class="item">
            <div class="wave-bg"></div>
            <h3>RAG to RICHES</h3><p>Master's Thesis</p>
          </div>
          <div class="item">
            <div class="wave-bg"></div>
            <h3>Smart Lock</h3><p>Raspberry Pi</p>
          </div>
           <div class="item">
            <div class="wave-bg"></div>
            <h3>Voice Assist</h3><p>VOSK + Python</p>
          </div>
           <div class="item">
            <div class="wave-bg"></div>
            <h3>Sound Mixer</h3><p>Arduino</p>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
