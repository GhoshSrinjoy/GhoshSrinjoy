<svg fill="none" viewBox="0 0 800 360" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        /* Container Height increased to 360px to fit taller cards */
        .container { width: 100%; height: 360px; background-color: #0d1117; display: flex; align-items: center; overflow: hidden; font-family: 'Segoe UI', Ubuntu, Sans-Serif; }
        
        /* Adjusted Track Width */
        .slider-track { display: flex; width: calc(250px * 12); animation: scroll 35s linear infinite; padding-left: 20px; }
        @keyframes scroll { 0% { transform: translateX(0); } 100% { transform: translateX(calc(-250px * 6)); } }

        /* CARD STYLE - FIXED DIMENSIONS (Taller/Vertical) */
        .card { 
            width: 220px;       /* Narrower */
            height: 320px;      /* Much Taller */
            background: #161b22; 
            margin: 0 15px; 
            border-radius: 16px; 
            position: relative; 
            overflow: hidden;
            box-shadow: 0px 8px 20px -9px rgba(0,0,0,0.45);
            transition: transform 0.3s ease;
        }
        .card:hover { transform: translateY(-10px) scale(1.02); z-index: 10; }

        /* WAVE ANIMATION - Adjusted for Taller Aspect Ratio */
        .wave { position: absolute; width: 540px; height: 700px; opacity: 0.6; left: 0; top: 0; margin-left: -50%; margin-top: -70%; border-radius: 40%; animation: wave 55s infinite linear; }
        .wave:nth-child(2) { top: 210px; animation-duration: 50s; opacity: 0.4; }
        .wave:nth-child(3) { top: 210px; animation-duration: 45s; opacity: 0.3; }
        @keyframes wave { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* TEXT CONTENT LAYOUT */
        .card-content { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; z-index: 10; padding-top: 40px; }
        
        .icon { font-size: 40px; margin-bottom: 15px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4)); transform: translateY(0); transition: 0.3s; }
        .card:hover .icon { transform: scale(1.1); }
        
        .title { color: #fff; font-weight: 700; font-size: 18px; text-align: center; margin: 5px 0; text-shadow: 0 2px 4px rgba(0,0,0,0.5); text-transform: uppercase; letter-spacing: 1px; }
        
        .tech { color: rgba(255,255,255,0.9); font-size: 13px; text-align: center; font-weight: 500; text-shadow: 0 1px 2px rgba(0,0,0,0.5); margin-top: 5px; width: 80%; line-height: 1.4; }

        /* --- COLOR PALETTES (Applying Gradients to Waves) --- */
        /* C1: Purple/Blue */
        .c1 .wave { background: linear-gradient(744deg,#af40ff,#5b42f3 60%,#00ddeb); }
        /* C2: Neon Green/Teal */
        .c2 .wave { background: linear-gradient(744deg,#00FFC6,#008F7A 60%,#42E695); }
        /* C3: Thesis Gold/Orange */
        .c3 .wave { background: linear-gradient(744deg,#FFD700,#FF8C00 60%,#FF4500); }
        /* C4: Cyber Pink */
        .c4 .wave { background: linear-gradient(744deg,#FF00FF,#D60270 60%,#9B4F96); }
        /* C5: Deep Ocean */
        .c5 .wave { background: linear-gradient(744deg,#00B4DB,#0083B0 60%,#00E1FF); }
         /* C6: Crimson Red */
        .c6 .wave { background: linear-gradient(744deg,#ED213A,#93291E 60%,#FDC830); }
      </style>

      <div class="container">
        <div class="slider-track">
          <div class="card c1">
            <div class="wave"></div><div class="wave"></div><div class="wave"></div>
            <div class="card-content">
                <div class="icon">🤖</div>
                <div class="title">Workflow<br/>Auto</div>
                <div class="tech">GPT-3.5 • Argo<br/>Chainlit</div>
            </div>
          </div>
          <div class="card c2">
            <div class="wave"></div><div class="wave"></div><div class="wave"></div>
             <div class="card-content">
                <div class="icon">⚡</div>
                <div class="title">FPGA<br/>ML</div>
                <div class="tech">Vitis AI • YOLO<br/>BERT</div>
            </div>
          </div>
          <div class="card c3">
            <div class="wave"></div><div class="wave"></div><div class="wave"></div>
             <div class="card-content">
                <div class="icon">🎓</div>
                <div class="title">RAG to<br/>RICHES</div>
                <div class="tech">Master's Thesis<br/>Multimodal</div>
            </div>
          </div>
          <div class="card c4">
            <div class="wave"></div><div class="wave"></div><div class="wave"></div>
             <div class="card-content">
                <div class="icon">🔐</div>
                <div class="title">Smart<br/>Lock</div>
                <div class="tech">Raspberry Pi<br/>Face Recog</div>
            </div>
          </div>
           <div class="card c5">
            <div class="wave"></div><div class="wave"></div><div class="wave"></div>
             <div class="card-content">
                <div class="icon">🎙️</div>
                <div class="title">Voice<br/>Assist</div>
                <div class="tech">VOSK<br/>Offline AI</div>
            </div>
          </div>
           <div class="card c6">
            <div class="wave"></div><div class="wave"></div><div class="wave"></div>
             <div class="card-content">
                <div class="icon">🕸️</div>
                <div class="title">Knowledge<br/>Graph</div>
                <div class="tech">NLP<br/>Graph DB</div>
            </div>
          </div>

          <div class="card c1">
            <div class="wave"></div><div class="wave"></div><div class="wave"></div>
            <div class="card-content"><div class="icon">🤖</div><div class="title">Workflow<br/>Auto</div><div class="tech">GPT-3.5 • Argo<br/>Chainlit</div></div>
          </div>
          <div class="card c2">
            <div class="wave"></div><div class="wave"></div><div class="wave"></div>
             <div class="card-content"><div class="icon">⚡</div><div class="title">FPGA<br/>ML</div><div class="tech">Vitis AI • YOLO<br/>BERT</div></div>
          </div>
          <div class="card c3">
            <div class="wave"></div><div class="wave"></div><div class="wave"></div>
             <div class="card-content"><div class="icon">🎓</div><div class="title">RAG to<br/>RICHES</div><div class="tech">Master's Thesis<br/>Multimodal</div></div>
          </div>
          <div class="card c4">
            <div class="wave"></div><div class="wave"></div><div class="wave"></div>
             <div class="card-content"><div class="icon">🔐</div><div class="title">Smart<br/>Lock</div><div class="tech">Raspberry Pi<br/>Face Recog</div></div>
          </div>
           <div class="card c5">
            <div class="wave"></div><div class="wave"></div><div class="wave"></div>
             <div class="card-content"><div class="icon">🎙️</div><div class="title">Voice<br/>Assist</div><div class="tech">VOSK<br/>Offline AI</div></div>
          </div>
           <div class="card c6">
            <div class="wave"></div><div class="wave"></div><div class="wave"></div>
             <div class="card-content"><div class="icon">🕸️</div><div class="title">Knowledge<br/>Graph</div><div class="tech">NLP<br/>Graph DB</div></div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
